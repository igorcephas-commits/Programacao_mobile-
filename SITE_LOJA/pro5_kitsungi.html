<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PRO 5 KINTSUNGI</title>
    <style>
        body { background-color: #000000; font-family: sans-serif; color: #DCDCDC; }
        img { border-radius: 10px; width: 400px; height: auto; margin: 5px; }
             
        .btn-compra {
            background-color: #28a745; 
            color: white;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-compra:hover {
            background-color: #218838;
            box-shadow: 0px 0px 15px #28a745;
        }
    </style>
</head>
<body>

<center>
    <h2>A Umbro Pro 5 Bump Kintsugi é uma chuteira de futsal profissional com couro natural para melhor<br>
        controle e tecnologia BUMP, que garante conforto e amortecimento nas quadras.
    </h2>

    <table>
        <tr>
            <td><img src="PRODUTOS/PRO5_KITSUNGI.png"> </td>
            <td><img src="PRODUTOS/fora_kitsungi.png"> </td>
        </tr>
        <tr>
            <td><img src="PRODUTOS/dentro_kitsungi.png"> </td>
            <td><img src="PRODUTOS/sola_kitsungi.png"> </td>
        </tr>
    </table>

    <h1><font color="#FF0000">R$699,99</font></h1> 

     <button onclick="adicionarAoCarrinho('Umbro Pro 5 Kintsugi', 699.99, 'PRODUTOS/PRO5_KITSUNGI.png')" class="btn-compra">
        🛒 ADICIONAR AO CARRINHO
    </button>
</center>

<script>
    function adicionarAoCarrinho(nome, preco, imagem) {
        let carrinho = JSON.parse(localStorage.getItem('meuCarrinho')) || [];
        
        carrinho.push({
            nome: nome,
            preco: preco,
            imagem: imagem
        });
        
        localStorage.setItem('meuCarrinho', JSON.stringify(carrinho));
        
        window.location.href = 'carrinho.html';
    }
</script>

</body>
</html>
